<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="500" height="500" role="img" aria-label="TradeX logo">
  <defs>
    <linearGradient id="tx-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="tx-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a1a10" />
      <stop offset="100%" stop-color="#020403" />
    </radialGradient>
    <linearGradient id="tx-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
    <linearGradient id="tx-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
  </defs>

  <!-- Base dark disc -->
  <circle cx="50" cy="50" r="46" fill="url(#tx-glow)" />
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#tx-ring)" stroke-width="2" opacity="0.9" />

  <!-- Orbit ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#tx-ring)" stroke-width="1" stroke-dasharray="2 8" opacity="0.6" />

  <!-- Upward trend line -->
  <path d="M22,64 L36,56 L46,61 L60,40 L74,47 L82,28" fill="none" stroke="url(#tx-line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  <circle cx="82" cy="28" r="3.5" fill="#00ff66" />

  <!-- TX Monogram -->
  <text x="50" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="26" letter-spacing="-1" fill="url(#tx-text)">TX</text>
</svg>
